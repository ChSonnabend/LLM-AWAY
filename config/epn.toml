[server]
host = "127.0.0.1"
port = 8765

[model]
name = "qwen3.8-27b-q4km"

[codex]
provider_display_name = "Christian Sonnabend"
# ChatGPT/Codex account sign-in is managed by the app; this documents the intended account.
account_email = "sonnabendch@gmail.com"

# Full local filesystem and network access for this explicitly selected profile.
sandbox_mode = "danger-full-access"
approval_policy = "never"
# Working context budget; retain the remote server's larger capacity.
context_window = 65536
auto_compact_token_limit = 45000
tool_output_token_limit = 2000
# Initial prompt copied into the EPN model catalog by install-codex-config.
instructions = "You are a coding agent sharing the user's workspace. Complete requested work using the available tools. Read only relevant files; batch related reads. Preserve existing changes. For inspection requests, use read-only commands and then answer. For edits, use apply_patch instead of shell heredocs or hand-counted git patches. After two failed attempts change approach. Keep commands and tool output short; retain errors and use targeted ranges instead of dumping files. Run one focused check after editing. Continue authorized work without asking again. If access is denied, use an available permission tool; otherwise report the exact blocker and needed action. Never claim execution without a tool result. Never print tool-call markup as an answer. Keep the final answer brief: result, checks, and any blocker."

[backend]
# "slurm_server" starts/reuses a persistent llama.cpp server allocation.
# "slurm" keeps the older one-shot run-cli diagnostic path.
type = "slurm_server"

[ssh]
host = "epnh"
user = ""
connect_timeout_seconds = 60
retries = 2
retry_delay_seconds = 2

[remote]
runner = "/scratch/csonnabe/cern-fellowship/misc/lamacpp-llm/scripts/epn/llm-epn-slurm-run"
serverctl = "/scratch/csonnabe/cern-fellowship/misc/lamacpp-llm/scripts/epn/llm-epn-serverctl"
workdir = "/scratch/csonnabe/cern-fellowship/misc/lamacpp-llm"
state_dir = "$HOME/.cache/llm-epn"

[slurm]
partition = "prod"
exclusive = true
# Prefer MI100; use an idle MI50 when no MI100 is idle.
node_class = "mi100"
mi50_fallback = true
custom_options = []
debug = false

[gateway]
# 0 means choose a free local SSH tunnel port for each gateway process.
local_port = 0
server_port = 8080
startup_timeout_seconds = 900
poll_interval_seconds = 5
idle_timeout_minutes = 20
cancel_on_exit = true
# Also cancel an already-running EPN job when this local provider session exits.
cancel_reused_on_exit = true
stream_startup_log = true
# Disable character truncation; llama.cpp enforces the token context limit.
max_prompt_chars = 0
prompt_keep_head_chars = 4000
prompt_keep_tail_chars = 16000

[llamacpp]
backend = "rocm"
# "auto" maps epn000-epn279 to gfx906 and epn280-epn349 to gfx908 inside the Slurm job.
rocm_arch = "auto"
visible_devices = "0,1,2,3,4,5,6,7"
build_before_run = false
show_config_before_run = false
list_devices_before_run = false
run_cli = "bin/run-cli"
inference_timeout_seconds = 900
max_tokens = 16384
extra_args = ["-n", "64"]
model_name = "qwen3.8-27b-q4km"
# auto follows the remote preset; on/off explicitly control MTP in the remote wrapper.
mtp = "off"
server_cli = "bin/run-server"
model_path = ""
context_size = 262000
# Qwen 3.8 otherwise returns its internal reasoning separately; direct content works best for the proxy.
server_extra_args = ["--reasoning", "off"]
# Optional full server command, relative to remote.workdir if not absolute.
# When set, this replaces server_cli/server_extra_args.
server_command = []
