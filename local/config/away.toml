[server]
host = "127.0.0.1"
port = 8765

[model]
name = "qwen3.8-27b-q4km"

[codex]
provider_display_name = "Christian Sonnabend"
# ChatGPT/Codex account sign-in is managed by the app; this documents the intended account.
account_email = "sonnabendch@gmail.com"

# Full local filesystem and network access for this explicitly selected profile.
sandbox_mode = "danger-full-access"
approval_policy = "never"
# Working context budget; the server runs with a 128k context.
context_window = 128000
auto_compact_token_limit = 90000
tool_output_token_limit = 2000
# Initial prompt copied into the AWAY model catalog by install-codex-config.
instructions = "You are a coding agent sharing the user's workspace. Complete requested work using the available tools. Read only relevant files; batch related reads. Preserve existing changes. For inspection requests, use read-only commands and then answer. For edits, use apply_patch instead of shell heredocs or hand-counted git patches. After two failed attempts change approach. Keep commands and tool output short; retain errors and use targeted ranges instead of dumping files. Run one focused check after editing. Continue authorized work without asking again. When a requested step needs a tool, issue the actual tool call in the same response. Do not end a turn with only an announcement such as Let me check or I will run. Continue authorized steps until complete, blocked, or genuinely missing user information; do not wait for go ahead. If access is denied, use an available permission tool; otherwise report the exact blocker and needed action. Never claim execution without a tool result. Never print tool-call markup as an answer. Keep the final answer brief: result, checks, and any blocker. Be very token efficient, fix broken files, edit quick and run as few tests as possible, in the best case none at all. Minimize the number of queries, you are very copmute-resource limited."

[backend]
# "slurm_server" starts/reuses a persistent llama.cpp server allocation.
# "slurm" keeps the older one-shot run-cli diagnostic path.
type = "slurm_server"

[ssh]
host = "epnh"
user = ""
connect_timeout_seconds = 60
retries = 2
retry_delay_seconds = 2

[remote]
runner = "/scratch/csonnabe/cern-fellowship/misc/LLM-AWAY/remote/scripts/remote/llm-away-slurm-run"
serverctl = "/scratch/csonnabe/cern-fellowship/misc/LLM-AWAY/remote/scripts/remote/llm-away-serverctl"
workdir = "/scratch/csonnabe/cern-fellowship/misc/LLM-AWAY/remote"
state_dir = "$HOME/.cache/llm-away"

[slurm]
partition = "prod"
exclusive = true
# Prefer MI100; use an idle MI50 when no MI100 is idle.
node_class = "mi100"
mi50_fallback = true
# Full nodes per allocation. 1 = single node (current behavior). >1 requests a
# multi-node allocation, which only increases VRAM for one model when the remote
# wrapper spans it across nodes (llama.cpp RPC/multi-node) and Slurm is IB-aware.
# With the current single-node wrapper, N>1 yields N independent nodes but the
# server still uses one. Override per launch with: llm-away serve --nodes N
# or REMOTE_NODES=N away-agent
nodes = 1
custom_options = []
debug = false

# Additional remote hosts. `llm-away serve --host NAME` (or REMOTE_HOST=NAME away-agent)
# connects to that host instead of [ssh].host. Models/infrastructure must exist
# there before the host can be used (see README "Host selection").
[hosts.hydra-h200]
ssh_host = "hydra"
partition = "nvidia_gpu"
exclusive = false
node_class = ""
mi50_fallback = false
nodes = 1
gpus = 4
backend = "cuda"
container = "/lustre/alice/users/csonnab/cern-fellowship/misc/LLM-AWAY/remote/containers/llama-server-cuda.sif"
container_source = "docker://ghcr.io/ggml-org/llama.cpp:server-cuda"
rocm_arch = "auto"
# Keep the GPU mask assigned by Slurm.
visible_devices = ""
remote_workdir = "/lustre/alice/users/csonnab/cern-fellowship/misc/LLM-AWAY/remote"
runner = "/lustre/alice/users/csonnab/cern-fellowship/misc/LLM-AWAY/remote/scripts/remote/llm-away-slurm-run"
serverctl = "/lustre/alice/users/csonnab/cern-fellowship/misc/LLM-AWAY/remote/scripts/remote/llm-away-serverctl"
# Login-host /u home paths are unavailable on Hydra GPU nodes.
state_dir = "/lustre/alice/users/csonnab/.cache/llm-away/hydra-h200"
custom_options = ["--cpus-per-task=16", "--mem=64G", "--time=02:00:00"]

[hosts.hydra-mi100]
ssh_host = "hydra"
partition = "amd_gpu"
exclusive = false
node_class = ""
mi50_fallback = false
nodes = 1
gpus = 8
backend = "rocm"
container = "/lustre/alice/users/csonnab/cern-fellowship/misc/LLM-AWAY/remote/containers/llama-server-rocm.sif"
container_source = "docker://ghcr.io/ggml-org/llama.cpp:server-rocm"
rocm_arch = "gfx908"
# Keep the GPU mask assigned by Slurm.
visible_devices = ""
remote_workdir = "/lustre/alice/users/csonnab/cern-fellowship/misc/LLM-AWAY/remote"
runner = "/lustre/alice/users/csonnab/cern-fellowship/misc/LLM-AWAY/remote/scripts/remote/llm-away-slurm-run"
serverctl = "/lustre/alice/users/csonnab/cern-fellowship/misc/LLM-AWAY/remote/scripts/remote/llm-away-serverctl"
state_dir = "/lustre/alice/users/csonnab/.cache/llm-away/hydra-mi100"
custom_options = ["--cpus-per-task=16", "--mem=64G", "--time=02:00:00"]

[gateway]
# 0 means choose a free local SSH tunnel port for each gateway process.
local_port = 0
server_port = 8080
startup_timeout_seconds = 900
poll_interval_seconds = 5
idle_timeout_minutes = 20
cancel_on_exit = true
# Also cancel an already-running AWAY job when this local provider session exits.
cancel_reused_on_exit = true
stream_startup_log = true
# Disable character truncation; llama.cpp enforces the token context limit.
max_prompt_chars = 0
prompt_keep_head_chars = 4000
prompt_keep_tail_chars = 16000

[llamacpp]
backend = "rocm"
# "auto" maps epn000-epn279 to gfx906 and epn280-epn349 to gfx908 inside the Slurm job.
rocm_arch = "auto"
visible_devices = "0,1,2,3,4,5,6,7"
build_before_run = false
show_config_before_run = false
list_devices_before_run = false
run_cli = "bin/run-cli"
inference_timeout_seconds = 900
max_tokens = 16384
extra_args = ["-n", "64"]
model_name = "qwen3.8-27b-q4km"
# auto follows the remote preset; on/off explicitly control MTP in the remote wrapper.
mtp = "on"
server_cli = "bin/run-server"
model_path = ""
context_size = 128000
# Qwen 3.8 otherwise returns its internal reasoning separately; direct content works best for the proxy.
server_extra_args = ["--reasoning", "off", "--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0", "--batch-size", "2048", "--ubatch-size", "2048"]
# Optional full server command, relative to remote.workdir if not absolute.
# When set, this replaces server_cli/server_extra_args.
server_command = []
