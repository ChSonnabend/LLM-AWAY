[server]
host = "127.0.0.1"
port = 8765

[model]
name = "qwen3.8-27b-q4km"

[agent]
# Ask when both CLIs exist; automatically select the only installed CLI.
# Override per invocation with run --cli codex|claude or LLM_AWAY_CLI.
cli = "auto"

[claude]
# Blank reuses [codex].instructions via --append-system-prompt.
instructions = ""

[codex]
custom_metadata = true
provider_display_name = "Christian Sonnabend"
# ChatGPT/Codex account sign-in is managed by the app; this documents the intended account.
account_email = "sonnabendch@gmail.com"

# Full local filesystem and network access for this explicitly selected profile.
sandbox_mode = "danger-full-access"
approval_policy = "never"
# Base context budget; model presets may override it.
context_window = 128000
auto_compact_token_limit = 180000
tool_output_token_limit = 2000
# Medium by default; GLM maps medium to its supported high effort.
reasoning_effort = "low"
model_verbosity = "low"
hide_agent_reasoning = true
# Initial prompt copied into the model catalog by install-codex-config.
instructions = "Complete requested edits with the smallest correct change. Batch related reads and SSH commands. Reuse established facts; do not repeat successful inspections without a reason. Once sufficient evidence is available, edit rather than continuing discovery. Preserve unrelated changes and follow repository instructions. After two failed attempts, change approach or report a concrete blocker. Use the provided tools and exact argument schemas; never invent commands or claim execution without tool evidence. Prefer patches for edits. Run focused checks appropriate to the change. Report the result, verification and remaining uncertainty briefly. Be very token efficient and converge fast."

[backend]
# "slurm_server" starts/reuses a persistent llama.cpp server allocation.
# "slurm" keeps the older one-shot run-cli diagnostic path.
type = "slurm_server"

[ssh]
host = "epnh"
user = ""
connect_timeout_seconds = 20
retries = 3
retry_delay_seconds = 2

[remote]
runner = "/scratch/csonnabe/LLM-AWAY/remote/scripts/remote/llm-away-slurm-run"
serverctl = "/scratch/csonnabe/LLM-AWAY/remote/scripts/remote/llm-away-serverctl"
workdir = "/scratch/csonnabe/LLM-AWAY/remote"
state_dir = "$HOME/.cache/llm-away"

[slurm]
partition = "prod"
exclusive = true
# Prefer MI100; use an idle MI50 when no MI100 is idle.
node_class = "mi100"
mi50_fallback = true
# Full nodes per allocation. 1 = single node (current behavior). >1 requests a
# multi-node allocation, which only increases VRAM for one model when the remote
# wrapper spans it across nodes (llama.cpp RPC/multi-node) and Slurm is IB-aware.
# With the current single-node wrapper, N>1 yields N independent nodes but the
# server still uses one. Override per launch with: llm-away serve --nodes N
# or REMOTE_NODES=N away-agent
nodes = 1
custom_options = []
debug = false

# Additional remote hosts. `llm-away serve --host NAME` (or REMOTE_HOST=NAME away-agent)
# connects to that host instead of [ssh].host. Models/infrastructure must exist
# there before the host can be used (see README "Host selection").
[hosts.hydra-h200]
ssh_host = "hydra"
partition = "nvidia_gpu"
exclusive = false
node_class = ""
mi50_fallback = false
nodes = 1
gpus = 4
backend = "cuda"
container = "/lustre/alice/users/csonnab/LLM-AWAY/remote/containers/llama-server-cuda.sif"
container_source = "docker://ghcr.io/ggml-org/llama.cpp:server-cuda"
rocm_arch = "auto"
# Keep the GPU mask assigned by Slurm.
visible_devices = ""
remote_workdir = "/lustre/alice/users/csonnab/LLM-AWAY/remote"
runner = "/lustre/alice/users/csonnab/LLM-AWAY/remote/scripts/remote/llm-away-slurm-run"
serverctl = "/lustre/alice/users/csonnab/LLM-AWAY/remote/scripts/remote/llm-away-serverctl"
# Login-host /u home paths are unavailable on Hydra GPU nodes.
state_dir = "/lustre/alice/users/csonnab/.cache/llm-away/hydra-h200"
custom_options = ["--cpus-per-task=16", "--mem=64G", "--time=02:00:00"]

[hosts.hydra-mi100]
ssh_host = "hydra"
partition = "amd_gpu"
exclusive = false
node_class = ""
mi50_fallback = false
nodes = 1
gpus = 8
backend = "rocm"
container = "/lustre/alice/users/csonnab/LLM-AWAY/remote/containers/llama-server-rocm.sif"
container_source = "docker://ghcr.io/ggml-org/llama.cpp:server-rocm"
rocm_arch = "gfx908"
# Keep the GPU mask assigned by Slurm.
visible_devices = ""
remote_workdir = "/lustre/alice/users/csonnab/LLM-AWAY/remote"
runner = "/lustre/alice/users/csonnab/LLM-AWAY/remote/scripts/remote/llm-away-slurm-run"
serverctl = "/lustre/alice/users/csonnab/LLM-AWAY/remote/scripts/remote/llm-away-serverctl"
state_dir = "/lustre/alice/users/csonnab/.cache/llm-away/hydra-mi100"
custom_options = ["--cpus-per-task=16", "--mem=64G", "--time=02:00:00"]

[gateway]
# 0 means choose a free local SSH tunnel port for each gateway process.
local_port = 0
server_port = 8080
startup_timeout_seconds = 900
poll_interval_seconds = 5
idle_timeout_minutes = 20
cancel_on_exit = true
# Also cancel an already-running AWAY job when this local provider session exits.
cancel_reused_on_exit = true
stream_startup_log = true
# Disable character truncation; llama.cpp enforces the token context limit.
max_prompt_chars = 0
prompt_keep_head_chars = 4000
prompt_keep_tail_chars = 16000

[llamacpp]
# Setup saves per-host shared paths in model.hosts.json; blank uses remote.workdir.
models_dir = ""
installation_dir = ""
backend = "rocm"
# "auto" maps epn000-epn279 to gfx906 and epn280-epn349 to gfx908 inside the Slurm job.
rocm_arch = "auto"
visible_devices = "0,1,2,3,4,5,6,7"
build_before_run = false
show_config_before_run = false
list_devices_before_run = false
run_cli = "bin/run-cli"
inference_timeout_seconds = 900
max_tokens = 16384
extra_args = ["-n", "64"]
model_name = "qwen3.8-27b-q4km"
# auto follows the remote preset; on/off explicitly control MTP in the remote wrapper.
mtp = "auto"
server_cli = "bin/run-server"
model_path = ""
context_size = 128000
# Qwen 3.8 otherwise returns its internal reasoning separately; direct content works best for the proxy.
server_extra_args = ["--reasoning", "off", "--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0", "--batch-size", "2048", "--ubatch-size", "512"]
# Optional full server command, relative to remote.workdir if not absolute.
# When set, this replaces server_cli/server_extra_args.
server_command = []
